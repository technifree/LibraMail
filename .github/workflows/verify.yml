name: Verify sources

on:
  push:
    branches: ["master", "main", "dev-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check repository safety
        shell: bash
        run: |
          chmod +x security_check.sh
          ./security_check.sh

      - name: Check application version
        run: python tools/check_version.py

      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [Path("neutralino.config.json")]
          files += sorted(Path("resources/locales").glob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} JSON files")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find engine resources/js tools -type f -name '*.js' -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Test embedded SQLite dependency
        working-directory: engine
        run: |
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); const r=db.prepare('SELECT 1 AS ok').get(); if(r.ok!==1) process.exit(1); db.close(); console.log('better-sqlite3: OK');"

      - name: Run complete test suite
        working-directory: engine
        run: npm test
