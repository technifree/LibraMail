name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
  # Recovery route for an already-pushed tag after fixing CI packaging.
  # Run this workflow on master with the existing version; never rewrite tags.
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag version to publish (e.g. 0.6.2)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Match tag and application version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          CONFIG_VERSION="$(python3 -c "import json; print(json.load(open('neutralino.config.json'))['version'])")"
          test "$TAG_VERSION" = "$FILE_VERSION"
          test "$TAG_VERSION" = "$CONFIG_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git merge-base --is-ancestor "$RELEASE_TAG" HEAD || {
              echo "Le tag existant $RELEASE_TAG n'est pas un ancêtre de la version courante." >&2
              exit 1
            }
            # A manual retry can update packaging/CI only, not application
            # behavior relative to the already-published version tag.
            changes="$(git diff --name-only "$RELEASE_TAG" HEAD)"
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|.gitignore|THIRD_PARTY_NOTICES.md|docs/PUBLISHING.md|tools/prepare_imapsync_ci.py|tools/test_v062_imapsync_ci.js|tools/test_prepare_imapsync_ci.py) ;;
                *) echo "Manuel impossible : fichier applicatif changé depuis $RELEASE_TAG : $file" >&2; exit 1 ;;
              esac
            done <<< "$changes"
          fi
          chmod +x security_check.sh
          ./security_check.sh
          python3 tools/check_version.py
          python3 tools/generate_release_notes.py "$TAG_VERSION" --check

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [Path("neutralino.config.json")]
          files += sorted(Path("resources/locales").glob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} JSON files")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find engine resources/js tools -type f -name '*.js' -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Test embedded SQLite dependency
        working-directory: engine
        run: |
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); const r=db.prepare('SELECT 1 AS ok').get(); if(r.ok!==1) process.exit(1); db.close(); console.log('better-sqlite3: OK');"

      - name: Run complete test suite
        working-directory: engine
        run: npm test

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip xz-utils build-essential python3 dpkg-dev
          sudo apt-get install -y --no-install-recommends \
            libauthen-ntlm-perl libclass-load-perl libcrypt-openssl-rsa-perl \
            libcrypt-ssleay-perl libdata-uniqid-perl libdigest-hmac-perl \
            libdist-checkconflicts-perl libencode-imaputf7-perl \
            libfile-copy-recursive-perl libfile-tail-perl libio-compress-perl \
            libio-socket-inet6-perl libio-socket-ssl-perl libio-tee-perl \
            libjson-webtoken-perl libmail-imapclient-perl libmodule-scandeps-perl \
            libnet-dbus-perl libnet-dns-perl libnet-ssleay-perl \
            libpar-packer-perl libproc-processtable-perl libreadonly-perl \
            libregexp-common-perl libsys-meminfo-perl libterm-readkey-perl \
            libunicode-string-perl liburi-perl

      - name: Prepare verified imapsync 2.314 Linux engine
        shell: bash
        run: |
          python3 tools/prepare_imapsync_ci.py linux
          runtime/imapsync/imapsync --version || runtime/imapsync/imapsync --help

      - name: Build Linux portable and Debian packages
        run: |
          chmod +x build_linux.sh build_deb.sh
          ./build_deb.sh --fresh-npm

      - name: Collect Linux files
        run: |
          mkdir -p release-linux
          cp build/linux/*.zip release-linux/ 2>/dev/null || true
          cp build/linux/*.tar.gz release-linux/ 2>/dev/null || true
          cp build/linux/*.deb release-linux/ 2>/dev/null || true
          cp build/linux/*.sha256 release-linux/ 2>/dev/null || true
          test -n "$(find release-linux -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-linux -maxdepth 1 -type f -print -quit)"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux/*
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python for imapsync verification
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare verified imapsync 2.314 Windows engine
        shell: pwsh
        env:
          IMAPSYNC_WINDOWS_ZIP_SHA256: ${{ vars.IMAPSYNC_WINDOWS_ZIP_SHA256 }}
        run: |
          python tools/prepare_imapsync_ci.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\runtime\imapsync\imapsync.exe --version
          if ($LASTEXITCODE -ne 0) {
            & .\runtime\imapsync\imapsync.exe --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build portable Windows package
        shell: pwsh
        run: |
          & .\build_windows.ps1 -FreshNpm
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-windows -Force | Out-Null
          Copy-Item build\windows\*.zip release-windows\ -ErrorAction SilentlyContinue
          Copy-Item build\windows\*.sha256 release-windows\ -ErrorAction SilentlyContinue

          if (-not (Get-ChildItem release-windows -File)) {
            throw 'No Windows package generated.'
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows/*
          if-no-files-found: error

  publish:
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release existante détectée : $RELEASE_TAG"

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LibraMail ${RELEASE_TAG#v}" \
              --notes-file .github/release-notes.md

            gh release upload "$RELEASE_TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "LibraMail ${RELEASE_TAG#v}" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
