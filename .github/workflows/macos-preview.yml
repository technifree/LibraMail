name: Experimental macOS portable packages

# Intentionally separate from the official release until BOTH architectures
# have been built, tested on macOS, and Gatekeeper signing has been qualified.
# Pushes to this development branch run the preview without placing the
# experimental workflow on master. Manual dispatch becomes available once
# the workflow is merged into the default branch.
on:
  push:
    branches:
      - dev-0.6.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS preview (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify version and sources
        shell: bash
        run: |
          ./security_check.sh
          python3 tools/check_version.py
          python3 tools/generate_release_notes.py --check
          bash -n build_macos.sh
          test "$(uname -m)" = '${{ matrix.arch }}'

      - name: Install native imapsync packaging prerequisites (Apple Silicon)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          brew install imapsync cpanminus
          # Homebrew imapsync is built against the Perl supplied by macOS.
          # Do not build PAR::Packer with Homebrew Perl 5.x: the Perl modules
          # installed by the imapsync formula may not be ABI-compatible.
          export PATH="/usr/bin:$PATH"
          test "$(command -v perl)" = '/usr/bin/perl'
          perl -e 'printf "[imapsync] Perl %s : %s\n", $^V, $^X'
          # The formula installs third-party modules in its private libexec.
          IMAPSYNC_PERL_LIB="$(brew --prefix imapsync)/libexec/lib/perl5"
          test -d "$IMAPSYNC_PERL_LIB"
          export PERL5LIB="$RUNNER_TEMP/pp-lib/lib/perl5:$IMAPSYNC_PERL_LIB"
          cpanm --notest --local-lib-contained "$RUNNER_TEMP/pp-lib" PAR::Packer Digest::HMAC
          # Check the modules needed by the verified imapsync 2.314 source
          # before running the PAR static/dynamic dependency scanner.
          perl -MDigest::HMAC_SHA1 -MIO::Socket::SSL -MNet::SSLeay -MMail::IMAPClient \
            -e 'print "[imapsync] Perl SSL/IMAP dependencies available\n"'
          test -x "$RUNNER_TEMP/pp-lib/bin/pp"
          echo '/usr/bin' >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pp-lib/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$PERL5LIB" >> "$GITHUB_ENV"

      - name: Build native .app and ZIP (no personal data)
        shell: bash
        env:
          IMAPSYNC_MACOS_X64_SHA256: ${{ vars.IMAPSYNC_MACOS_X64_SHA256 }}
        run: |
          if [[ '${{ matrix.arch }}' == 'arm64' ]]; then
            export PATH="/usr/bin:$PATH"
            test "$(command -v perl)" = '/usr/bin/perl'
          fi
          chmod +x build_macos.sh
          ./build_macos.sh
          test -n "$(find build/macos -name 'LibraMail-*.zip' -type f -print -quit)"

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: libramail-macos-${{ matrix.arch }}-preview
          path: build/macos/*
          if-no-files-found: error
          retention-days: 14
